[package]
name = "alarmate"
version = "0.4.0"
authors = ["Adrian Kumpf"]
edition = "2024"
description = "A Rust client for the LUPUSEC XT2 alarm panel API"
repository = "https://github.com/adriankumpf/alarmate"
license = "MIT"
rust-version = "1.85"
keywords = ["lupusec", "alarm", "smarthome", "xt2"]
categories = ["api-bindings", "network-programming"]

[dependencies]
# native-tls, not the default rustls: the panel only speaks legacy TLS versions
# and ciphers that rustls refuses.
reqwest = { version = "0.13.4", default-features = false, features = ["form", "native-tls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
strum = { version = "0.28", features = ["derive"] }
num_enum = "0.7"
clap = { version = "4.6.6", features = ["derive", "env"], optional = true }
tokio = { version = "1.53.1", default-features = false, features = ["macros", "rt"], optional = true }
thiserror = "2.0.20"

[dev-dependencies]
wiremock = "0.6"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread"] }

[features]
build-binary = ["dep:clap", "dep:tokio"]

[[bin]]
name = "alarmate"
required-features = ["build-binary"]

[profile.release]
lto = true
strip = "debuginfo"
codegen-units = 1
